<!doctype html>
<html lang="en" data-theme="dark">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="dark light" />
  <meta name="theme-color" content="#090f12" />
  <meta name="description" data-i18n-content="app.description" />
  <title>Orbia</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="preload" href="/fonts/JetBrainsMono-Regular.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="stylesheet" href="/style.css?v=21" />
  <script src="/app.js?v=33" type="module"></script>
</head>

<body>
  <a class="skip-link" href="#main" data-i18n="navigation.skipToContent"></a>
  <svg class="svg-defs" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <symbol id="i-search" viewBox="0 0 24 24">
        <circle cx="10.5" cy="10.5" r="6.5" />
        <path d="m16 16 5 5" />
      </symbol>
      <symbol id="i-plus" viewBox="0 0 24 24">
        <path d="M12 5v14M5 12h14" />
      </symbol>
      <symbol id="i-grid" viewBox="0 0 24 24">
        <rect x="4" y="4" width="6" height="6" rx="1" />
        <rect x="14" y="4" width="6" height="6" rx="1" />
        <rect x="4" y="14" width="6" height="6" rx="1" />
        <rect x="14" y="14" width="6" height="6" rx="1" />
      </symbol>
      <symbol id="i-list" viewBox="0 0 24 24">
        <path d="M9 6h12M9 12h12M9 18h12M3 6h1M3 12h1M3 18h1" />
      </symbol>
      <symbol id="i-bookmark" viewBox="0 0 24 24">
        <path d="M6 4h12v17l-6-4-6 4z" />
      </symbol>
      <symbol id="i-settings" viewBox="0 0 24 24">
        <path d="M4 7h16M4 17h16" />
        <circle cx="9" cy="7" r="3" />
        <circle cx="15" cy="17" r="3" />
      </symbol>
      <symbol id="i-edit" viewBox="0 0 24 24">
        <path d="m15 4 5 5M4 20l5-1L21 7l-5-5L4 14z" />
      </symbol>
      <symbol id="i-arrow" viewBox="0 0 24 24">
        <path d="M4 12h16m-6-6 6 6-6 6" />
      </symbol>
      <symbol id="i-close" viewBox="0 0 24 24">
        <path d="m6 6 12 12M6 18 18 6" />
      </symbol>
      <symbol id="i-check" viewBox="0 0 24 24">
        <path d="m5 12 4 4L19 6" />
      </symbol>
      <symbol id="i-sun" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="4" />
        <path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1 1m12 12 1 1M5 19l1-1M18 6l1-1" />
      </symbol>
      <symbol id="i-archive" viewBox="0 0 24 24">
        <path d="M5 9v12h14V9M3 3h18v6H3zM9 13h6" />
      </symbol>
      <symbol id="i-command" viewBox="0 0 24 24">
        <path
          d="M8 8h8v8H8zM8 8H5a3 3 0 1 1 3-3v3Zm8 0V5a3 3 0 1 1 3 3h-3Zm0 8h3a3 3 0 1 1-3 3v-3Zm-8 0v3a3 3 0 1 1-3-3h3Z" />
      </symbol>
    </defs>
  </svg>

  <section id="login" class="login-screen" hidden>
    <form id="login-form" class="login-card" method="post">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">[·]</span><span>Orbia</span>
      </div>
      <p class="login-intro" data-i18n="auth.signInHint"></p>
      <label for="password" data-i18n="auth.password"></label>
      <input id="password" name="password" type="password" required autocomplete="current-password"
        data-i18n-placeholder="auth.passwordPlaceholder" />
      <p id="login-error" class="form-error" role="alert"></p>
      <button class="button primary" type="submit" data-i18n="auth.signIn"></button>
    </form>
  </section>

  <section id="setup-screen" class="login-screen" hidden>
    <div class="login-card" id="setup-container">
      <h1 data-i18n="auth.setupTitle"></h1>
    </div>
  </section>

  <div id="app" class="shell" hidden>
    <header class="header">
      <button class="brand brand-button" data-action="dashboard" data-i18n-aria-label="navigation.orbiaDashboard">
        <span class="brand-mark" aria-hidden="true">[·]</span><span>Orbia</span>
      </button>
      <nav class="main-nav" data-i18n-aria-label="navigation.main">
        <button class="nav-item active" id="nav-dashboard" data-action="dashboard"><svg aria-hidden="true">
            <use href="#i-grid" />
          </svg><span data-i18n="navigation.dashboard"></span></button>
        <button class="nav-item" id="nav-bookmarks" data-action="bookmarks"><svg aria-hidden="true">
            <use href="#i-bookmark" />
          </svg><span data-i18n="navigation.bookmarks"></span></button>
      </nav>
      <div class="header-actions">
        <button class="nav-item" data-action="search" data-i18n-aria-label="search.title"><svg aria-hidden="true">
            <use href="#i-search" />
          </svg></button>
        <button class="nav-item" data-action="command" data-i18n-aria-label="commands.title"><svg aria-hidden="true">
            <use href="#i-command" />
          </svg></button>
        <button class="icon-button" data-action="settings" data-i18n-aria-label="settings.title"><svg>
            <use href="#i-settings" />
          </svg></button>
      </div>
    </header>

    <main id="main" tabindex="-1">
      <section id="dashboard-view" data-i18n-aria-label="dashboard.quickDashboard">
        <div class="dashboard-toolbar" id="dashboard-toolbar" hidden>
          <div class="page-tabs" id="page-tabs" role="tablist" data-i18n-aria-label="dashboard.pageTabs"></div>
        </div>
        <div class="edit-bar" id="edit-bar" hidden>
          <span data-i18n="dashboard.dragHint"></span>
          <div>
            <button class="text-button" data-action="new-group" data-i18n="dashboard.addGroup"></button>
            <button class="text-button" data-action="new-page" data-i18n="dashboard.addPage"></button>
            <button class="button small-button" data-action="new-link">
              <svg>
                <use href="#i-plus" />
              </svg><span data-i18n="dashboard.quicklink"></span>
            </button>
            <button class="text-button" data-action="edit-page" data-i18n="dashboard.editPage"></button>
          </div>
        </div>
        <div id="groups" class="groups-grid"></div>
        <div id="quick-status" class="quick-status" role="status"></div>
      </section>

      <section id="bookmark-view" data-i18n-aria-label="navigation.bookmarks" hidden>
        <div class="bookmark-heading">
          <div>
            <h1><span data-i18n="navigation.bookmarks"></span><span class="accent">.</span></h1>
          </div>
          <button class="button primary" data-action="new-bookmark" data-i18n-aria-label="bookmarks.add">
            <svg>
              <use href="#i-plus" />
            </svg><span data-i18n="bookmarks.add"></span>
          </button>
        </div>
        <div class="bookmark-toolbar">
          <div class="search-field">
            <svg>
              <use href="#i-search" />
            </svg><input id="bookmark-query" data-i18n-aria-label="bookmarks.filter" type="search"
              data-i18n-placeholder="bookmarks.searchPlaceholder" autocomplete="off" spellcheck="false" /><kbd>/</kbd>
          </div>
          <button class="button" id="archive-toggle" data-action="archive-view" aria-pressed="false">
            <svg>
              <use href="#i-archive" />
            </svg><span data-i18n="bookmarks.archive"></span>
          </button>
          <button class="button" id="unread-toggle" data-action="unread-view" aria-pressed="false" data-i18n="bookmarks.unread"></button>
          <div class="view-switch" role="group" data-i18n-aria-label="bookmarks.view">
            <button class="icon-button" data-action="grid" id="grid-view" data-i18n-aria-label="bookmarks.gridView"
              aria-pressed="true">
              <svg>
                <use href="#i-grid" />
              </svg></button><button class="icon-button" data-action="list" id="list-view" data-i18n-aria-label="bookmarks.listView"
              aria-pressed="false">
              <svg>
                <use href="#i-list" />
              </svg>
            </button>
          </div>
        </div>
        <div class="bookmark-layout">
          <aside class="tag-sidebar" data-i18n-aria-label="bookmarks.tagNavigation">
            <div class="sidebar-heading">
              <span data-i18n="bookmarks.tagsHeading"></span>
              <button class="text-button" data-action="clear-filters" data-i18n="bookmarks.clearFilters"></button>
            </div>
            <div id="bookmark-tags"></div>
          </aside>
          <div class="bookmark-content">
            <div class="results-heading">
              <span id="bookmark-count" role="status"></span><span class="small muted" data-i18n="bookmarks.searchFields"></span>
            </div>
            <div id="bookmarks" class="bookmark-grid"></div>
            <button id="load-more" class="button load-more" data-action="load-more" hidden data-i18n="bookmarks.loadMore"></button>
          </div>
        </div>
      </section>
    </main>

    <nav class="mobile-nav" data-i18n-aria-label="navigation.quickActions">
      <button data-action="dashboard">
        <svg>
          <use href="#i-grid" />
        </svg><span data-i18n="navigation.dashboard"></span></button><button data-action="bookmarks">
        <svg>
          <use href="#i-bookmark" />
        </svg><span data-i18n="navigation.bookmarks"></span></button><button data-action="search">
        <svg>
          <use href="#i-search" />
        </svg><span data-i18n="navigation.search"></span></button><button data-action="mobile-add">
        <svg>
          <use href="#i-plus" />
        </svg><span data-i18n="common.add"></span>
      </button>
    </nav>
  </div>

  <dialog id="search-dialog" class="search-dialog" aria-labelledby="search-title">
    <div class="search-dialog-heading">
      <h2 id="search-title" data-i18n="search.title"></h2>
      <button class="icon-button" data-close="search-dialog" data-i18n-aria-label="search.close">
        <svg>
          <use href="#i-close" />
        </svg>
      </button>
    </div>
    <div class="search-field large-search">
      <svg>
        <use href="#i-search" />
      </svg><input id="panel-query" aria-describedby="panel-count" type="search" data-i18n-aria-label="search.title"
        data-i18n-placeholder="search.placeholder" autocomplete="off" spellcheck="false" /><kbd>esc</kbd>
    </div>
    <div id="panel-tags" class="panel-tags" data-i18n-aria-label="search.matchingTags"></div>
    <div id="panel-count" class="sr-only" role="status"></div>
    <div id="panel-results" class="panel-results"></div>
    <div class="panel-footer">
      <span><kbd>↑</kbd><kbd>↓</kbd> <span data-i18n="keyboard.select"></span> <kbd>↵</kbd> <span data-i18n="keyboard.open"></span></span>
      <button class="text-button" data-action="all-results" data-i18n="search.allResults"></button>
    </div>
  </dialog>

  <dialog id="command-dialog" class="command-dialog" aria-labelledby="command-title">
    <div class="search-field large-search">
      <svg>
        <use href="#i-command" />
      </svg><label for="command-query" class="sr-only" id="command-title" data-i18n="commands.title"></label><input id="command-query"
        data-i18n-placeholder="commands.placeholder" autocomplete="off" /><button class="icon-button" data-close="command-dialog"
        data-i18n-aria-label="commands.close">
        <svg>
          <use href="#i-close" />
        </svg>
      </button>
    </div>
    <div id="commands" class="commands"></div>
    <div id="command-status" class="sr-only" role="status"></div>
    <div class="panel-footer">
      <span><kbd>↑</kbd><kbd>↓</kbd> <span data-i18n="keyboard.select"></span> <kbd>↵</kbd> <span data-i18n="keyboard.run"></span></span><span class="muted small">Orbia</span>
    </div>
  </dialog>

  <dialog id="editor-dialog" class="editor-dialog" aria-labelledby="editor-title">
    <form id="editor-form">
      <div class="dialog-heading">
        <h2 id="editor-title"></h2>
        <button type="button" class="icon-button" data-close="editor-dialog" data-i18n-aria-label="common.closeDialog">
          <svg>
            <use href="#i-close" />
          </svg>
        </button>
      </div>
      <div id="editor-fields" class="editor-fields"></div>
      <p id="editor-error" class="form-error" role="alert"></p>
      <div id="delete-confirm" class="delete-confirm" hidden>
        <span data-i18n="editor.deleteWarning"></span>
        <button type="button" class="button danger" id="confirm-delete" data-i18n="editor.confirmDelete"></button>
      </div>
      <div class="dialog-actions">
        <button type="button" class="text-button danger-text" id="delete-button" hidden data-i18n="common.delete"></button>
        <div>
          <button type="button" class="button" data-close="editor-dialog" data-i18n="common.cancel"></button>
          <button type="submit" class="button primary" id="save-button" data-i18n="common.save"></button>
        </div>
      </div>
    </form>
  </dialog>

  <dialog id="settings-dialog" class="settings-dialog" aria-labelledby="settings-title">
    <div class="dialog-heading">
      <h2 id="settings-title" data-i18n="settings.title"></h2>
      <button class="icon-button" data-close="settings-dialog" data-i18n-aria-label="settings.close">
        <svg>
          <use href="#i-close" />
        </svg>
      </button>
    </div>
    <section class="settings-section settings-general">
      <label for="language" data-i18n="settings.language"></label>
      <select id="language">
        <option value="de" lang="de">Deutsch</option>
        <option value="en" lang="en" selected>English</option>
      </select>
      <button class="button" data-action="theme">
        <svg>
          <use href="#i-sun" />
        </svg><span id="theme-label"></span>
      </button>
      <div class="link-target-setting">
        <label for="dashboard-target" data-i18n="settings.dashboardLinks"></label>
        <select id="dashboard-target">
          <option value="_self" data-i18n="settings.sameTab"></option>
          <option value="_blank" data-i18n="settings.newTab"></option>
        </select>
      </div>
      <div class="link-target-setting">
        <label for="bookmark-target" data-i18n="settings.bookmarkLinks"></label>
        <select id="bookmark-target">
          <option value="_self" data-i18n="settings.sameTab"></option>
          <option value="_blank" data-i18n="settings.newTab"></option>
        </select>
      </div>
      <p id="language-status" class="small error" role="status" hidden></p>
    </section>

    <details name="settings-group" class="settings-section" id="access-settings">
      <summary data-i18n="access.title"></summary>
      <form id="access-form" class="integration-form" method="post">
        <div id="current-password-field" hidden><label for="current-password" data-i18n="access.currentPassword"></label>
          <input id="current-password" type="password" autocomplete="current-password" />
        </div>
        <label for="access-mode" data-i18n="access.signInMethod"></label>
        <select id="access-mode">
          <option value="password" data-i18n="access.requirePassword"></option>
          <option value="open" data-i18n="access.passwordless"></option>
        </select>
        <p id="open-access-hint" class="error" hidden data-i18n="access.passwordlessWarning"></p>
        <div id="new-password-field"><label for="new-password" data-i18n="access.newPassword"></label>
          <input id="new-password" type="password" minlength="12" autocomplete="new-password" />
        </div>
        <button type="submit" class="button" data-i18n="access.save"></button>
        <p id="access-status" class="small" role="status"></p>
      </form>
    </details>
    <details name="settings-group" class="settings-section">
      <summary data-i18n="tokens.title"></summary>
      <p data-i18n="tokens.instructions"></p>
      <div class="copy-field">
        <code id="server-url"></code>
        <button type="button" class="text-button copy-button" data-action="copy-url" data-i18n-aria-label="common.copy">
          <span aria-hidden="true" data-i18n="common.copy"></span>
          <svg aria-hidden="true"><use href="#i-check" /></svg>
        </button>
      </div>
      <p id="server-url-status" class="small copy-status" role="status"></p>
      <form class="integration-form" id="token-form" method="post">
        <label for="token-name" data-i18n="tokens.appName"></label>
        <input id="token-name" required maxlength="80" data-i18n-placeholder="tokens.appPlaceholder" />
        <button class="button" type="submit" data-i18n="tokens.create"></button>
      </form>
      <div id="new-token" hidden>
        <label for="token-value" data-i18n="tokens.newToken"></label>
        <div class="copy-field"><input id="token-value" readonly autocomplete="off" spellcheck="false" />
          <button type="button" class="text-button copy-button" data-action="copy-token" data-i18n-aria-label="common.copy">
            <span aria-hidden="true" data-i18n="common.copy"></span>
            <svg aria-hidden="true"><use href="#i-check" /></svg>
          </button>
        </div>
        <p id="token-copy-status" class="small copy-status" role="status"></p>
      </div>
      <div id="token-list"></div>
      <p id="token-status" class="small" role="status"></p>
    </details>
    <details name="settings-group" class="settings-section">
      <summary data-i18n="linkding.title"></summary>
      <p data-i18n="linkding.instructions"></p>
      <form class="integration-form" id="pull-form" method="post">
        <label for="source-url" data-i18n="linkding.server"></label>
        <input id="source-url" type="url" required aria-describedby="source-hint"
          placeholder="http://192.168.1.20:9090" />
        <p id="source-hint" class="small muted" data-i18n="linkding.httpWarning"></p>
        <label for="source-token" data-i18n="linkding.apiToken"></label>
        <input id="source-token" type="password" required autocomplete="off" />
        <button class="button" type="submit" data-i18n="linkding.startImport"></button>
      </form>
      <p id="pull-status" role="status" class="small"></p>
    </details>
    <details name="settings-group" class="settings-section">
      <summary data-i18n="backup.title"></summary>
      <p data-i18n="backup.instructions"></p>
      <div class="transfer-actions">
        <a class="button" href="/api/orbia/export?format=html" download data-i18n="backup.exportHtml"></a>
        <a class="button" href="/api/orbia/export" download data-i18n="backup.exportJson"></a>
        <label class="button file-button" for="import-file">
          <span data-i18n="backup.importFile"></span><input id="import-file" type="file" accept=".html,.htm,.json" />
        </label>
      </div>
      <p id="import-status" class="small" role="status"></p>
    </details>
    <details name="settings-group" class="settings-section">
      <summary data-i18n="keyboard.title"></summary>
      <div class="shortcut-list">
        <span data-i18n="commands.openDashboard"></span><kbd>⌘ / Ctrl D</kbd>
        <span data-i18n="commands.openBookmarks"></span><kbd>⌘ / Ctrl B</kbd>
        <span data-i18n="keyboard.findCode"></span><kbd>A–Z</kbd>
        <span data-i18n="keyboard.switchPage"></span><kbd>1–9</kbd>
        <span data-i18n="common.edit"></span><kbd>⌘ / Ctrl E</kbd>
        <span data-i18n="common.add"></span><kbd>+</kbd>
        <span data-i18n="keyboard.searchBookmarks"></span><kbd>⌘ / Ctrl P</kbd>
        <span data-i18n="keyboard.searchByTag"></span><kbd>#</kbd>
        <span data-i18n="keyboard.openCommands"></span><kbd>⌘ / Ctrl K</kbd>
        <span data-i18n="keyboard.closeOrClear"></span><kbd>Esc</kbd>
      </div>
    </details>
    <button class="text-button danger-text logout" data-action="logout" data-i18n="auth.signOut"></button>
  </dialog>
  <div id="toast" class="toast" role="status" hidden></div>
</body>

</html>
