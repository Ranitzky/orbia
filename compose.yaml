services:
  orbia:
    build: .
    restart: unless-stopped
    user: "${PUID:-99}:${PGID:-100}"
    ports:
      - "${ORBIA_BIND:-0.0.0.0}:${ORBIA_PORT:-8080}:8080"
    environment:
      ORBIA_ADDR: ":8080"
      ORBIA_DB: /data/orbia.db
      ORBIA_PASSWORD: "${ORBIA_PASSWORD:?Set a password of at least 12 characters in .env}"
      ORBIA_ORIGIN: "${ORBIA_ORIGIN:-}"
      ORBIA_SECURE_COOKIE: "${ORBIA_SECURE_COOKIE:-false}"
      ORBIA_SEED_DEMO: "${ORBIA_SEED_DEMO:-false}"
    volumes:
      - "${ORBIA_DATA_DIR:-./data}:/data"
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
